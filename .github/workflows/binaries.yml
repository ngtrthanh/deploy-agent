name: Binaries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-agent-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, suffix: linux-amd64 }
          - { goos: linux,   goarch: arm64, suffix: linux-arm64 }
          - { goos: linux,   goarch: arm, goarm: '7', suffix: linux-armv7 }
          - { goos: linux,   goarch: arm, goarm: '6', suffix: linux-armv6 }
          - { goos: linux,   goarch: '386', suffix: linux-386 }
          - { goos: windows, goarch: amd64, suffix: windows-amd64.exe }
          - { goos: windows, goarch: arm64, suffix: windows-arm64.exe }
          - { goos: windows, goarch: '386', suffix: windows-386.exe }
          - { goos: darwin,  goarch: amd64, suffix: darwin-amd64 }
          - { goos: darwin,  goarch: arm64, suffix: darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Build ${{ matrix.suffix }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" \
            -o "dist/deploy-agent-${{ matrix.suffix }}" ./cmd/deploy-agent
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-agent-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  edge-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum deploy-agent-* > checksums.txt
      - name: Publish rolling edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete edge --cleanup-tag -y 2>/dev/null || true
          git tag -d edge 2>/dev/null || true
          git push origin :refs/tags/edge 2>/dev/null || true
          git tag edge "${GITHUB_SHA}"
          git push origin refs/tags/edge
          gh release create edge dist/* \
            --title "deploy-agent edge" \
            --notes "Rolling binaries built from main at ${GITHUB_SHA}. For production, prefer a pinned v* release." \
            --prerelease
