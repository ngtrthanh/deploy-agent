name: Docker Demo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Build deploy-agent
        run: |
          mkdir -p bin
          go build -trimpath -o bin/deploy-agent ./cmd/deploy-agent
      - name: Run Docker demo
        run: bash demo/run.sh
      - name: Verify demo cleanup
        if: always()
        run: |
          ! docker ps -a --format '{{.Names}}' | grep -qx deploy-agent-demo-registry
          ! docker ps -a --format '{{.Names}}' | grep -q '^demo-'
          test ! -d demo/.work
